<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: file: https:; font-src 'self' data:; media-src 'self' data: blob: file:; connect-src 'self' file: data:; object-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Emufii</title>
  <link rel="stylesheet" href="./css/fonts.css">
  <link rel="stylesheet" href="./css/theme.css">
  <link rel="stylesheet" href="./css/motion.css">
  <link rel="stylesheet" href="./css/app.css">
</head>
<body data-theme="dark" data-accent="teal" data-input="mouse">
  <canvas id="trayBackdropCanvas" class="tray-backdrop" aria-hidden="true"></canvas>

  <header class="titlebar" id="appTitlebar">
    <div class="titlebar-brand">
      <img src="./assets/logo.png" alt="" draggable="false">
      <span>Emufii</span>
    </div>
    <div class="titlebar-controls" id="windowControls">
      <button class="window-btn" id="btnWinMinimize" title="Minimize" aria-label="Minimize" tabindex="-1">
        <svg width="10" height="1" viewBox="0 0 10 1" fill="currentColor"><rect width="10" height="1"/></svg>
      </button>
      <button class="window-btn" id="btnWinMaximize" title="Maximize" aria-label="Maximize" tabindex="-1">
        <svg width="10" height="10" viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1"><rect x="0.5" y="0.5" width="9" height="9"/></svg>
      </button>
      <button class="window-btn close" id="btnWinClose" title="Close" aria-label="Close" tabindex="-1">
        <svg width="10" height="10" viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.2"><line x1="1" y1="1" x2="9" y2="9"/><line x1="9" y1="1" x2="1" y2="9"/></svg>
      </button>
    </div>
  </header>

  <div class="app-scaffold">
    <nav class="header-band" id="appHeaderBand" hidden>
      <div class="header-left" id="headerLeftArea">
        <button class="header-avatar-btn" id="headerProfileBtn" title="Your profile" aria-label="Your profile" aria-haspopup="dialog">
          <span class="chip-avatar" id="headerProfileAvatar">J</span>
          <span class="user-status-dot online" id="headerStatusDot"></span>
        </button>

        <div class="header-status-block" id="headerStatusBlock">
          <div class="header-subtitle" id="headerSubtitle"></div>
          <div class="header-title-row">
            <span class="header-title" id="headerTitle">Library</span>
            <span class="header-count" id="headerCount"></span>
          </div>
        </div>
      </div>

      <div class="header-right">
        <button class="server-status-pill plate-button" id="vpsStatusChip" title="Emufii coordinator" aria-haspopup="dialog">
          <span class="lamp" id="vpsLamp"></span>
          <span class="server-status-text">
            <span class="server-name">Emufii server</span>
            <span class="server-sub" id="vpsText">Connecting…</span>
          </span>
        </button>

        <button class="icon-btn plate-button" id="headerFriendsBtn" title="Friends (Ctrl+Shift+F)" aria-label="Friends" aria-haspopup="dialog">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        </button>

        <button class="chip plate-button icon-chip" id="headerFinderBtn" title="Open sessions (Ctrl+O) · Join with a code (Ctrl+J)" aria-label="Open sessions" aria-haspopup="dialog">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" class="sessions-icon">
            <rect x="2" y="3" width="9.5" height="7.5" rx="2" stroke="currentColor" stroke-width="2" fill="none" />
            <rect x="12.5" y="13.5" width="9.5" height="7.5" rx="2" stroke="currentColor" stroke-width="2" fill="none" />
            <line x1="6.5" y1="10.5" x2="17.5" y2="13.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-dasharray="0.1 3.8" />
          </svg>
        </button>

        <button class="icon-btn plate-button" id="headerSettingsBtn" title="Settings (Ctrl+,)" aria-label="Settings">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        </button>
      </div>
    </nav>

    <div id="floatingPanelBackdrop" class="floating-panel-backdrop"></div>
    <div id="floatingCloudPanel" class="floating-cloud-panel" aria-hidden="true" inert></div>

    <main class="screen-container" id="screenHost">
      <div class="screen" id="currentScreenView"></div>
    </main>
  </div>

  <dialog id="factSheetDialog">
    <div class="dialog-content"></div>
  </dialog>

  <div class="drop-overlay" id="dropOverlay" aria-hidden="true">
    <div class="drop-overlay-card">
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
      <strong>Drop to add to your library</strong>
      <span>Game files or whole folders</span>
    </div>
  </div>

  <script src="./main.js" type="module"></script>
</body>
</html>
